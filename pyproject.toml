[project]
name = "regpang"
version = "0.1.0"
description = "규제팡: 법알못 창업자를 위한 규제 사전상담 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.6",
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pypdf>=7.1.0",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
regpang = "regpang.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regpang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
