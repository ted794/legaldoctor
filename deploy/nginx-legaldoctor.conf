# 기존 사이트의 server { ... } 블록 안, 기존 location / 보다 앞에 넣는다.
# /legaldoctor/ 경로로 리걸닥터(127.0.0.1:8100)를 연결함. 끝의 / 가 접두어를 떼어 줌
#
# 속도 제한: 리걸닥터는 유료 API를 호출하므로 nginx에서도 막는다.
# http { } 블록(예: /etc/nginx/conf.d/legaldoctor_rate.conf)에 아래 한 줄을 둔다
#   limit_req_zone $binary_remote_addr zone=legaldoctor:10m rate=30r/m;
# 앱 안에도 IP별 시간당 한도와 하루 전체 한도가 있음(LD_HEAVY_PER_HOUR, LD_HEAVY_PER_DAY)
#
# 접속 기록에 비밀 링크가 남지 않게: 검진·분석·케어 주소에는 무작위 토큰이 들어 있으므로 토큰 자리를 가린 기록 형식을 쓴다.
# http { } 블록(같은 conf.d 파일)에 아래를 둔다
#   map $request_uri $ld_uri {
#       "~^(?<ldp>/legaldoctor/api/(care|checkup|sessions)/)[A-Za-z0-9_-]{8,}(?<ldr>[^?]*)"  "$ldp***$ldr";
#       "~^(?<ldq>[^?]*)\?"  "$ldq?***";
#       default  $request_uri;
#   }
#   log_format legaldoctor "$remote_addr - [$time_local] \"$request_method $ld_uri\" $status $body_bytes_sent $request_time";
# (정규식에 중괄호가 있으므로 따옴표로 감싸야 함. 2026.11.20 운영 서버 nginx 1.18에서 확인)
# 보안 헤더(CSP, HSTS, 클릭재킹 방지 등)는 앱이 붙인다. nginx에서 같은 헤더를 또 붙이지 않는다

location = /legaldoctor {
    return 301 /legaldoctor/;
}

location /legaldoctor/ {
    limit_req zone=legaldoctor burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/legaldoctor.access.log legaldoctor;   # 토큰을 가린 형식. 사이트 공용 기록에는 남기지 않음

    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;                 # 분석·검진은 몇 분 걸릴 수 있음
    client_max_body_size 30m;                # 사업소개서·계약서 업로드
}
