# 기존 사이트의 server { ... } 블록 안에 넣는다. 도메인 아래 /legaldoctor/ 경로로 리걸닥터를 연결함
# 리걸닥터 화면은 상대 경로로 API를 부르므로 접두어를 떼고 넘기면 된다

location = /legaldoctor {
    return 301 /legaldoctor/;
}

location /legaldoctor/ {
    proxy_pass http://127.0.0.1:8100/;      # 끝의 / 가 접두어(/legaldoctor)를 떼어 줌
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;                 # 분석·검진은 몇 분 걸릴 수 있음
    client_max_body_size 30m;                # 사업소개서·계약서 업로드
}
