<html><head><style>@font-face{font-family:'Noto Sans KR';font-weight:400;src:url('file:///tmp/claude-0/-home-user-regpang/6998dffd-3559-50e7-86f5-4fd799a01021/scratchpad/fonts/NotoSansKR-400.woff2') format('woff2');}@font-face{font-family:'Noto Sans KR';font-weight:600;src:url('file:///tmp/claude-0/-home-user-regpang/6998dffd-3559-50e7-86f5-4fd799a01021/scratchpad/fonts/NotoSansKR-600.woff2') format('woff2');}@font-face{font-family:'Noto Sans KR';font-weight:700;src:url('file:///tmp/claude-0/-home-user-regpang/6998dffd-3559-50e7-86f5-4fd799a01021/scratchpad/fonts/NotoSansKR-700.woff2') format('woff2');}@font-face{font-family:'Noto Sans KR';font-weight:400;src:url('file:///tmp/claude-0/-home-user-regpang/6998dffd-3559-50e7-86f5-4fd799a01021/scratchpad/fonts/NotoSansKR-latin-400.woff2');unicode-range:U+0000-00FF}@font-face{font-family:'Noto Sans KR';font-weight:700;src:url('file:///tmp/claude-0/-home-user-regpang/6998dffd-3559-50e7-86f5-4fd799a01021/scratchpad/fonts/NotoSansKR-latin-700.woff2');unicode-range:U+0000-00FF}body{margin:0}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="60" y="92" font-size="46" font-weight="700" fill="#1b1f24">스타트업 리걸닥터는 범용 AI와 무엇이 다른가</text>
  <text x="62" y="138" font-size="24" fill="#5b6573">창업에서 운영까지, 같은 원문 대조 엔진으로 검진함</text>

  <!-- 왼쪽: 범용 AI -->
  <rect x="60" y="175" width="500" height="770" rx="24" fill="#f4f5f7"/>
  <text x="96" y="232" font-size="30" font-weight="700" fill="#495057">범용 AI에 질문</text>
  <rect x="120" y="270" width="380" height="70" rx="14" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <text x="310" y="314" font-size="24" text-anchor="middle" fill="#1b1f24">창업자 질문</text>
  <line x1="310" y1="342" x2="310" y2="376" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="120" y="380" width="380" height="86" rx="14" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <text x="310" y="418" font-size="24" text-anchor="middle" fill="#1b1f24">모델의 기억</text>
  <text x="310" y="450" font-size="19" text-anchor="middle" fill="#868e96">학습 시점까지의 지식</text>
  <line x1="310" y1="468" x2="310" y2="502" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="120" y="506" width="380" height="70" rx="14" fill="#fff" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="550" font-size="24" text-anchor="middle" fill="#1b1f24">그럴듯한 답</text>
  <g font-size="21" fill="#343a40">
    <text x="92" y="642"><tspan fill="#495057" font-weight="700">×</tspan>  조문을 기억으로 인용함</text>
    <text x="120" y="672" fill="#868e96" font-size="19">없는 조문이나 옛 조문이 섞임</text>
    <text x="92" y="722"><tspan fill="#495057" font-weight="700">×</tspan>  법률 단계에서 답이 끝남</text>
    <text x="92" y="772"><tspan fill="#495057" font-weight="700">×</tspan>  학습 뒤의 승인 사례·개정을 모름</text>
    <text x="92" y="822"><tspan fill="#495057" font-weight="700">×</tspan>  빈칸은 추정으로 채움</text>
    <text x="92" y="872"><tspan fill="#495057" font-weight="700">×</tspan>  대화가 끝나면 그걸로 끝</text>
  </g>

  <!-- 오른쪽: 규제팡 -->
  <rect x="600" y="175" width="1260" height="770" rx="24" fill="#FBF2F3" stroke="#E9C4CA" stroke-width="2"/>
  <text x="640" y="232" font-size="30" font-weight="700" fill="#A51C30">스타트업 리걸닥터</text>
  <text x="905" y="232" font-size="22" fill="#5b6573">후보는 AI가 내고, 확정은 원문이 함</text>

  <!-- 열 머리 -->
  <g font-size="18" font-weight="700" fill="#868e96">
    <text x="640" y="276">어디서든 들어옴</text>
    <text x="990" y="276">같은 엔진</text>
    <text x="1510" y="276">출구</text>
  </g>

  <!-- A: 입구 -->
  <rect x="640" y="292" width="300" height="196" rx="16" fill="#ffffff" stroke="#A51C30" stroke-width="2.5"/>
  <text x="664" y="334" font-size="24" font-weight="700" fill="#1b1f24">규제팡 <tspan font-size="17" fill="#A51C30">창업 단계</tspan></text>
  <text x="664" y="368" font-size="19" fill="#343a40">BM 적법성 검토</text>
  <text x="664" y="396" font-size="19" fill="#343a40">규제샌드박스 신청</text>
  <text x="664" y="436" font-size="16" fill="#868e96">금지 · 진입장벽 · 직역 · 인증 지연</text>
  <text x="664" y="460" font-size="16" fill="#868e96">특례 만료 · AI 규제 미대응</text>

  <rect x="640" y="510" width="300" height="196" rx="16" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="664" y="552" font-size="24" font-weight="700" fill="#1b1f24">계약·노무 검진 <tspan font-size="17" fill="#868e96">운영 단계</tspan></text>
  <text x="664" y="586" font-size="19" fill="#343a40">투자계약 검진</text>
  <text x="664" y="614" font-size="19" fill="#343a40">노무 검진</text>
  <text x="664" y="654" font-size="16" fill="#868e96">창업자 개인 상환책임 · 보호 공백</text>
  <text x="664" y="678" font-size="16" fill="#868e96">프리랜서 근로자성 · 임금 체불</text>

  <rect x="640" y="728" width="300" height="96" rx="16" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="790" y="766" font-size="19" text-anchor="middle" fill="#495057" font-weight="700">스타트업이 죽는 28가지 사인</text>
  <text x="790" y="796" font-size="16" text-anchor="middle" fill="#868e96">개인정보·거래·지배구조·엑싯으로 확장</text>

  <text x="640" y="866" font-size="17" fill="#5b6573">입력: 스무고개·글·문서·그림</text>

  <!-- A → B -->
  <path d="M940,390 H966 V327 H984" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M940,608 H966 V390" fill="none" stroke="#495057" stroke-width="3"/>

  <!-- B: 엔진 -->
  <rect x="990" y="292" width="480" height="70" rx="14" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="1230" y="325" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f24">사실 확인</text>
  <text x="1230" y="351" font-size="17" text-anchor="middle" fill="#5b6573">판단을 가르는 사실을 스무고개로 먼저 물음</text>
  <line x1="1230" y1="364" x2="1230" y2="390" stroke="#495057" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="990" y="394" width="480" height="70" rx="14" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="1230" y="427" font-size="22" font-weight="700" text-anchor="middle" fill="#1b1f24">후보 생성</text>
  <text x="1230" y="453" font-size="17" text-anchor="middle" fill="#5b6573">Liner Model · Liner Search가 법령·해석 후보를 냄</text>
  <line x1="1230" y1="466" x2="1230" y2="492" stroke="#A51C30" stroke-width="3" marker-end="url(#aro)"/>
  <rect x="990" y="496" width="480" height="104" rx="16" fill="#A51C30"/>
  <text x="1230" y="538" font-size="27" font-weight="700" text-anchor="middle" fill="#ffffff">원문 대조 관문</text>
  <text x="1230" y="572" font-size="18" text-anchor="middle" fill="#F6E1E5">국가법령정보 원문에서 근거 구절을 그대로 찾음</text>
  <rect x="1080" y="614" width="300" height="38" rx="19" fill="#F4F5F7" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="1230" y="640" font-size="17" text-anchor="middle" fill="#A51C30">못 찾으면 탈락 · 허위 조문 0건</text>

  <text x="990" y="694" font-size="18" font-weight="700" fill="#495057">원문 위에서 더 깊이</text>
  <g>
    <rect x="990" y="710" width="150" height="136" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <text x="1065" y="746" font-size="19" font-weight="700" text-anchor="middle" fill="#1b1f24">숨은 규제</text>
    <text x="1065" y="778" font-size="15" text-anchor="middle" fill="#A51C30" font-weight="700">법률→시행령</text>
    <text x="1065" y="800" font-size="15" text-anchor="middle" fill="#A51C30" font-weight="700">→시행규칙</text>
    <text x="1065" y="822" font-size="15" text-anchor="middle" fill="#A51C30" font-weight="700">→고시·별표</text>
    <rect x="1155" y="710" width="150" height="136" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <text x="1230" y="746" font-size="19" font-weight="700" text-anchor="middle" fill="#1b1f24">선례·현존</text>
    <text x="1230" y="780" font-size="15" text-anchor="middle" fill="#343a40">승인 사례 2,859건</text>
    <text x="1230" y="804" font-size="15" text-anchor="middle" fill="#343a40">특례 뒤 미개정이면</text>
    <text x="1230" y="826" font-size="15" text-anchor="middle" fill="#343a40">현존 규제</text>
    <rect x="1320" y="710" width="150" height="136" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <text x="1395" y="746" font-size="19" font-weight="700" text-anchor="middle" fill="#1b1f24">그림자 규제</text>
    <text x="1395" y="780" font-size="15" text-anchor="middle" fill="#343a40">법령해석례</text>
    <text x="1395" y="804" font-size="15" text-anchor="middle" fill="#343a40">보도해명에서</text>
    <text x="1395" y="826" font-size="15" text-anchor="middle" fill="#343a40">부정적 해석</text>
  </g>
  <text x="990" y="888" font-size="17" fill="#5b6573">유형·소관·트랙은 규칙표로 판정, 같은 입력에 같은 결과</text>

  <!-- B → C -->
  <path d="M1472,548 H1490" fill="none" stroke="#A51C30" stroke-width="3"/>
  <path d="M1490,360 V720" fill="none" stroke="#A51C30" stroke-width="3"/>
  <path d="M1490,360 H1506" fill="none" stroke="#A51C30" stroke-width="3" marker-end="url(#aro)"/>
  <path d="M1490,540 H1506" fill="none" stroke="#A51C30" stroke-width="3" marker-end="url(#aro)"/>
  <path d="M1490,720 H1506" fill="none" stroke="#A51C30" stroke-width="3" marker-end="url(#aro)"/>

  <!-- C: 출구 -->
  <rect x="1510" y="292" width="310" height="136" rx="16" fill="#ffffff" stroke="#A51C30" stroke-width="2.5"/>
  <text x="1534" y="332" font-size="23" font-weight="700" fill="#1b1f24">규제 지도 · 검진표</text>
  <text x="1534" y="364" font-size="17" fill="#343a40">명시 · 의제 · 해석 리스크</text>
  <text x="1534" y="390" font-size="17" fill="#1971c2" font-weight="700">규정 공백 · 보호 공백</text>
  <text x="1534" y="414" font-size="15" fill="#868e96">확인한 근거와 남은 공백을 나눔</text>

  <rect x="1510" y="472" width="310" height="136" rx="16" fill="#e7f1fb" stroke="#a5d8ff" stroke-width="2"/>
  <text x="1534" y="512" font-size="23" font-weight="700" fill="#1971c2">신속확인 신청서 초안</text>
  <text x="1534" y="544" font-size="17" fill="#1971c2">규정 공백은 정부에 공식으로 물음</text>
  <text x="1534" y="570" font-size="17" fill="#1971c2">분야별 서식·제출처 안내</text>

  <rect x="1510" y="652" width="310" height="136" rx="16" fill="#1b1f24"/>
  <text x="1534" y="692" font-size="23" font-weight="700" fill="#ffffff">변호사 심화자문</text>
  <text x="1534" y="724" font-size="17" fill="#dee2e6">위험이 높은 항목을</text>
  <text x="1534" y="750" font-size="17" fill="#dee2e6">상담 준비서 한 장 들고 연결</text>

  <text x="1510" y="866" font-size="17" fill="#5b6573">모든 결과물은 상담 준비 자료로 표시</text>

  <!-- 하단 한 줄 -->
  <rect x="60" y="975" width="1800" height="72" rx="18" fill="#1b1f24"/>
  <text x="960" y="1021" font-size="28" text-anchor="middle" fill="#ffffff">범용 AI는 그럴듯한 답을, 리걸닥터는 <tspan fill="#F4A3AF" font-weight="700">원문으로 확인한 근거</tspan>와 <tspan fill="#74c0fc" font-weight="700">확인하지 못한 공백</tspan>을 나눠 줌</text>
</svg>
</body></html>
