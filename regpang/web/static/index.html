<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규제팡</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--sub:#5b6573;--line:#e3e6ea;--accent:#e8590c;--accent-soft:#fff1e8;--ok:#2b8a3e;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1f24;--ink:#e9ecef;--sub:#9aa4b1;--line:#2c323a;--accent:#ff8a3d;--accent-soft:#2a1d14;--ok:#51cf66;--chip:#262b33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1120px;margin:0 auto}
header h1{margin:0;font-size:26px;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{margin:2px 0 0;color:var(--sub)}
main{max-width:1120px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.alt{border-style:dashed}
main.single{grid-template-columns:1fr;max-width:900px}
.choices button.pick{border-color:var(--accent);background:var(--accent-soft)}
.ck-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.risk{display:inline-block;padding:0 7px;border-radius:4px;color:#fff;font-size:12px;margin-right:6px}
.pane{display:none}.pane.on{display:block}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:transparent;color:var(--ink);resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--sub);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
canvas{width:100%;height:320px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.hint{color:var(--sub);font-size:13px}
.q{font-size:18px;font-weight:600;margin:4px 0}
.why{color:var(--sub);font-size:13px;margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit}
.choices button:hover{border-color:var(--accent);background:var(--accent-soft)}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--sub);max-height:180px;overflow:auto}
.slot{padding:8px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .k{font-size:13px;color:var(--sub)}
.slot .v{white-space:pre-wrap}
.slot.empty .v{color:var(--sub);font-style:italic}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;font-size:12px;color:var(--sub)}
.slot input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;background:transparent;color:var(--ink);margin-top:4px}
.summary{font-weight:600;margin-bottom:8px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.badge.ok{background:var(--ok);color:#fff}
.result h3{margin:14px 0 4px;font-size:16px}
.result pre{white-space:pre-wrap;font:inherit;margin:0}
.warn{color:var(--accent);font-size:13px}
footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>규제<span>팡</span></h1>
  <p>막힌 규제, 팡! 뚫어 드려요. 편한 방법으로 사업을 알려 주세요.</p>
</header>
<main>
  <section class="card">
    <div class="tabs" id="tabs">
      <button data-p="talk" class="on">스무고개로 답하기</button>
      <button data-p="text">글로 설명하기</button>
      <button data-p="file">사업소개서 올리기</button>
      <button data-p="draw">그림으로 보여 주기</button>
      <button data-p="check" class="alt">운영 단계 검진</button>
    </div>

    <div class="pane on" id="p-talk">
      <div id="qbox"><p class="hint">법을 몰라도 괜찮아요. 쉬운 질문을 하나씩 드릴게요. 모르는 건 "잘 모르겠어요"를 누르면 됩니다.</p>
        <button class="btn" id="startTalk">질문 시작</button></div>
      <div class="log" id="qlog" hidden></div>
    </div>

    <div class="pane" id="p-text">
      <textarea id="bizText" placeholder="예) 아파트 단지 안 편의점 물건을 배달로봇이 집 앞까지 가져다주는 서비스입니다. 주문은 앱으로 받아요."></textarea>
      <div class="row"><button class="btn" id="sendText">보내기</button><span class="hint">한두 줄이어도 됩니다.</span></div>
    </div>

    <div class="pane" id="p-file">
      <label class="drop" id="drop">사업소개서·IR 자료를 여기에 끌어다 놓거나 눌러서 고르세요<br><span class="hint">PDF, PPTX, DOCX, HWPX, 사진. 한글(.hwp)은 PDF로 저장해서 올려 주세요.</span>
        <input type="file" id="fileIn" multiple hidden accept=".pdf,.pptx,.docx,.hwpx,.txt,.md,.png,.jpg,.jpeg,.webp"></label>
      <div class="row hint" id="fileList"></div>
    </div>

    <div class="pane" id="p-draw">
      <canvas id="cv"></canvas>
      <div class="row">
        <button class="btn" id="sendDraw">이 그림 보내기</button>
        <button class="btn ghost" id="clearDraw">지우기</button>
        <label class="btn ghost">사진·스크린샷 올리기<input type="file" id="imgIn" accept="image/*" hidden></label>
      </div>
      <p class="hint">서비스 흐름을 네모와 화살표로 그려 보세요. 고객, 회사, 돈, 물건이 어디로 가는지 보이면 충분합니다.</p>
    </div>
    <div class="pane" id="p-check">
      <p class="hint">회사를 운영하면서 생기는 법률 위험을 검진합니다. 스타트업이 죽는 28가지 사인 가운데 지금은 두 가지를 볼 수 있어요.</p>
      <div class="choices" id="ckMods">
        <button data-m="invest" class="pick">투자계약 검진 <span class="hint">· 13장 창업자 개인 상환책임, 14장 경영권, 27장 보호 공백</span></button>
        <button data-m="labor">노무 검진 <span class="hint">· 21장 노무 리스크, 10장 인재 이탈, 16장 IP 공백</span></button>
      </div>
      <textarea id="ckText" placeholder="투자계약서·텀시트 조항을 붙여 넣거나, 인력을 어떻게 쓰는지 적어 주세요."></textarea>
      <div class="row">
        <label class="btn ghost">계약서 올리기<input type="file" id="ckFile" multiple hidden accept=".pdf,.docx,.hwpx,.txt,.md"></label>
        <button class="btn ghost" id="ckDemo">가상 예시 불러오기</button>
        <button class="btn" id="ckRun">검진하기</button>
      </div>
      <div class="hint" id="ckFiles"></div>
      <div id="ckResult"></div>
    </div>
    <p class="warn" id="msg"></p>
  </section>

  <aside class="card">
    <div class="row" style="margin-top:0;justify-content:space-between">
      <strong>규제팡이 이해한 사업</strong><span class="badge" id="state">아직 정보 없음</span>
    </div>
    <div class="summary" id="summary"></div>
    <div id="slots"></div>
    <div class="row">
      <button class="btn ghost" id="editBtn">고칠 곳 있어요</button>
      <button class="btn" id="okBtn">이대로 맞아요</button>
    </div>
    <div class="result" id="result"></div>
  </aside>
</main>
<footer id="disc"></footer>
<script>
const $=s=>document.querySelector(s);
let sid=null,editing=false,last=null;
async function api(path,opt={}){const r=await fetch(path,opt);if(!r.ok){throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail)}return r.json()}
async function session(){if(!sid){sid=(await api('/api/sessions',{method:'POST'})).id}return sid}
function busy(on,text){document.querySelectorAll('.btn').forEach(b=>b.disabled=on);$('#msg').textContent=on?(text||'읽고 있어요...'):''}
function esc(s){return (s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  if(b.dataset.p==='draw')fitCanvas();
  const ck=b.dataset.p==='check';document.querySelector('aside').hidden=ck;document.querySelector('main').classList.toggle('single',ck);
});

function render(v){
  last=v;$('#disc').textContent='※ '+v.disclaimer;
  $('#summary').textContent=v.summary||'';
  const filled=v.slots.filter(s=>s.value).length;
  $('#state').textContent=v.confirmed?'확인 완료':`${filled}/${v.slots.length} 파악`;
  $('#state').classList.toggle('ok',v.confirmed);
  $('#slots').innerHTML=v.slots.map(s=>`<div class="slot ${s.value?'':'empty'}"><div class="k">${esc(s.label)}</div>
    ${editing?`<input data-k="${s.key}" value="${esc(s.value||'')}" placeholder="${esc(s.why)}">`:
    `<div class="v">${esc(s.value||'아직 몰라요')}</div>${s.sources.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}`}</div>`).join('');
  const notes=[...(v.skipped||[]),...(v.rejected||[]).map(r=>'근거를 못 찾아 뺀 항목: '+r)];
  if(notes.length)$('#msg').textContent=notes.join(' / ');
}

async function sendForm(fd,label){
  await session();busy(true,label);
  try{render(await api(`/api/sessions/${sid}/materials`,{method:'POST',body:fd}))}catch(e){$('#msg').textContent=e.message}finally{busy(false);}
}
$('#sendText').onclick=()=>{const t=$('#bizText').value.trim();if(!t)return;const fd=new FormData();fd.append('text',t);sendForm(fd,'설명을 읽고 있어요...')};
const fileIn=$('#fileIn'),drop=$('#drop');
function sendFiles(list){if(!list.length)return;const fd=new FormData();[...list].forEach(f=>fd.append('files',f));
  $('#fileList').textContent=[...list].map(f=>f.name).join(', ');sendForm(fd,'자료를 읽고 있어요. 쪽수가 많으면 조금 걸려요...')}
fileIn.onchange=()=>sendFiles(fileIn.files);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');sendFiles(e.dataTransfer.files)};
$('#imgIn').onchange=e=>sendFiles(e.target.files);

// 그리기판
const cv=$('#cv'),cx=cv.getContext('2d');let drawing=false,dirty=false;
function fitCanvas(){const r=cv.getBoundingClientRect();if(!r.width)return;const img=dirty?cx.getImageData(0,0,cv.width,cv.height):null;
  cv.width=r.width*2;cv.height=r.height*2;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);if(img)cx.putImageData(img,0,0);
  cx.lineWidth=5;cx.lineCap='round';cx.strokeStyle='#1b1f24'}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*2,(e.clientY-r.top)*2]}
cv.onpointerdown=e=>{drawing=dirty=true;cx.beginPath();cx.moveTo(...pos(e));cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drawing)return;cx.lineTo(...pos(e));cx.stroke()};
cv.onpointerup=()=>drawing=false;
$('#clearDraw').onclick=()=>{dirty=false;fitCanvas()};
$('#sendDraw').onclick=()=>{if(!dirty)return;const fd=new FormData();fd.append('drawing',cv.toDataURL('image/png'));sendForm(fd,'그림을 보고 있어요...')};

// 운영 단계 검진
let ckModule='invest';
document.querySelectorAll('#ckMods button').forEach(b=>b.onclick=()=>{ckModule=b.dataset.m;document.querySelectorAll('#ckMods button').forEach(x=>x.classList.toggle('pick',x===b))});
$('#ckFile').onchange=e=>{$('#ckFiles').textContent=[...e.target.files].map(f=>f.name).join(', ')};
$('#ckDemo').onclick=async()=>{try{$('#ckText').value=(await api('/api/checkup/demo/'+ckModule)).text}catch(e){$('#msg').textContent=e.message}};
const RC={'높음':'#c92a2a','중간':'#e8590c','낮음':'#2b8a3e'};
$('#ckRun').onclick=async()=>{
  const fd=new FormData();fd.append('module',ckModule);fd.append('text',$('#ckText').value);[...$('#ckFile').files].forEach(f=>fd.append('files',f));
  busy(true,'조항을 뽑고 법령 원문과 대조하고 있어요. 몇 분 걸릴 수 있어요...');
  try{const r=await api('/api/checkup',{method:'POST',body:fd});
    const hi=r.items.filter(i=>i.risk==='높음').length, lw=r.items.filter(i=>i.lawyer).length;
    $('#ckResult').innerHTML=`<h3>${esc(r.title)} · ${esc(r.causes.join(', '))}</h3><p class="hint">검진 항목 ${r.items.length} · 위험 높음 ${hi} · 변호사 심화자문 권함 ${lw}</p>`+
      `<div class="row"><a class="btn" href="/api/checkup/${r.id}" target="_blank">검진표 열기</a></div>`+
      r.items.map(i=>`<div class="ck-item"><span class="risk" style="background:${RC[i.risk]||'#495057'}">${esc(i.risk)}</span><b>${esc(i.label)}</b> · ${esc(i.verdict)}<div class="hint">“${esc(i.quote)}”</div>${i.lawyer?'<div class="hint" style="color:#1971c2">변호사 심화자문 권함</div>':''}</div>`).join('')+
      (r.halted?`<p class="warn">${esc(r.halted)}</p>`:'')+`<p class="hint">※ ${esc(r.disclaimer)}</p>`;
  }catch(e){$('#msg').textContent=e.message}finally{busy(false)}};

// 스무고개
function showQ(v){
  const q=v.question,log=$('#qlog');
  const hist=v.interview.history;log.hidden=!hist.length;
  log.innerHTML=hist.map(h=>`<div>Q${h.no}. ${esc(h.question)}<br>→ ${esc(h.answer)}</div>`).join('');
  if(!q){$('#qbox').innerHTML='<p class="q">필요한 건 다 여쭤봤어요.</p><p class="why">오른쪽 내용을 확인하고 "이대로 맞아요"를 눌러 주세요.</p>';return}
  $('#qbox').innerHTML=`<div class="hint">질문 ${q.no} / 최대 20</div><p class="q">${esc(q.text)}</p>${q.why?`<div class="why">${esc(q.why)}</div>`:''}
   <div class="choices">${q.choices.map(c=>`<button>${esc(c)}</button>`).join('')}</div>
   <div class="row"><input id="freeAns" placeholder="직접 답하기" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:transparent;color:var(--ink)"><button class="btn" id="freeBtn">답하기</button></div>`;
  document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>answer(b.textContent));
  $('#freeBtn').onclick=()=>{const a=$('#freeAns').value.trim();if(a)answer(a)};
}
async function answer(a){await session();busy(true,'다음 질문을 고르고 있어요...');
  try{const v=await api(`/api/sessions/${sid}/interview`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:a})});render(v);showQ(v)}
  catch(e){$('#msg').textContent=e.message}finally{busy(false)}}
$('#startTalk').onclick=()=>answer(null);

// 확인·분석
$('#editBtn').onclick=()=>{if(!last)return;editing=!editing;$('#editBtn').textContent=editing?'수정 취소':'고칠 곳 있어요';render(last)};
$('#okBtn').onclick=async()=>{await session();const edits={};
  if(editing)document.querySelectorAll('.slot input').forEach(i=>{const s=last.slots.find(x=>x.key===i.dataset.k);if(i.value.trim()&&i.value.trim()!==(s.value||''))edits[i.dataset.k]=i.value.trim()});
  busy(true,'규제를 살펴보고 있어요...');
  try{editing=false;$('#editBtn').textContent='고칠 곳 있어요';
    render(await api(`/api/sessions/${sid}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits})}));
    const r=await api(`/api/sessions/${sid}/analyze`,{method:'POST'});
    const out=n=>`/api/sessions/${sid}/out/${n}`;
    const links=r.outputs.length?`<div class="row"><a class="btn" href="${out('regmap.html')}" target="_blank">규제 지도</a><a class="btn ghost" href="${out('consult.html')}" target="_blank">변호사 상담 준비서</a><a class="btn ghost" href="${out('application.html')}" target="_blank">신속확인 신청서 초안</a><a class="btn ghost" href="${out('application.docx')}">신청서 Word</a></div><p class="hint">열린 문서에서 인쇄(Ctrl+P)를 누르면 PDF로 저장됩니다.</p>`:'';
    const counts=Object.entries(r.counts||{}).map(([k,v])=>`${esc(k)} ${v}`).join(' · ');
    $('#result').innerHTML=`<h3>권하는 길: ${esc(r.track||'')}</h3><p class="hint">${counts}</p>`+links+(r.halted_at?`<p class="warn">분석이 멈춘 단계: ${esc(r.halt_reason)}</p>`:'')+r.stages.map(s=>`<details><summary>${esc(s.stage)}</summary><pre>${esc(s.summary)}</pre></details>`).join('');
  }catch(e){$('#msg').textContent=e.message}finally{busy(false)}};
api('/api/sessions',{method:'POST'}).then(r=>{sid=r.id;return api('/api/sessions/'+sid)}).then(render).catch(()=>{});
</script>
</body>
</html>
