# 운영 서버(Python 3.11)와 개발 환경(3.13) 두 버전에서 테스트한다
name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q legaldoctor scripts tests
      - run: python -m pytest -q
